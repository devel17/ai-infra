apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Mattermost
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: mmuser
    secureJsonData:
      password: ${MM_POSTGRES_PASSWORD}
    jsonData:
      database: mattermost
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: false
    editable: true
