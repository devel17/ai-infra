model_list:
  - model_name: qwen3-coder:30b-a3b-instruct-ud-q3_K_XL
    litellm_params:
      model: openai/qwen3-coder:30b-a3b-instruct-ud-q3_K_XL
      api_base: http://host.docker.internal:1234/v1
      api_key: dummy

  - model_name: nomic-embed
    litellm_params:
      model: openai/nomic-ai/nomic-embed-text-v1-GGUF:Q4_K_M
      api_base: http://host.docker.internal:1234/v1
      api_key: dummy
    model_info:
      mode: embedding

litellm_settings:
  callbacks: ["prometheus"]
  enable_end_user_cost_tracking_prometheus_only: true
  require_auth_for_metrics_endpoint: false
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
